      let brands = ["애플", "구글", "아마존", "마이크로소프트", "메타"];
      for (const i in brands) {
        //in 뒤에는 내가 갖고오고싶은 배열이나 객체   앞에는 뭐를 갖고 오고 싶은지 변수 대부분 const
        //i는 인덱스 => 배열에서 그다지 많이 사용하지 않는다. 순회 - iterable data 순서적으로 가는거     for in 순회가 가능하게 해줌
        console.log(i);
        console.log(brands[i]);
      }
      //for in은 객체에서 많이 사용한다.

      let value = prompt("어떤 값을 알고 싶나요?");
      let found = false;

      for (let key in person) {
        if (key === value) {
          console.log(person[key]);
          found = true;
        }
      }
      if (!found) {
        console.log("존재하지 않는 키");
      } else if (person[key] === "") {
        console.log("빈 값");
      }
