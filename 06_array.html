<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <script>
      /*배열
        - 하나 이상의 데이터를 담을 수 있다.
        - 데이터에는 순서가 존재한다.(index)
        - index : 0 부터
        - [] 
        - 어떤 데이터도 올 수 있다.
        - 어떤 데이터도 함께 올 수 있다.
        - 생성하는 순간 속성(property) 중 length 가 자동으로 생김
        */
      let nums = [1, 2, 3, 4, 5];
      let str = ["a", "b", "c"];
      let mix = [3, 5.6, false, [3, 4, 5], { name: "공은성" }];
      console.log(nums);
      console.log(str);
      console.log(mix);
      console.log(nums.length);
      console.log(str.length);
      console.log(mix.length);
      console.log(mix[4]);
      console.log(mix[3]);
      // leta = [];
      // console.log(a.length); //0
      // console.log(a); //0

      //1. 배열 요소의 수정
      nums[4] = 6;
      console.log((nums[4] = 6));

      //2. 배열의 내장 함수(pop(), push()) push는 맨 끝에 넣음
      console.log(mix.pop());
      console.log(mix);
      console.log(mix.pop());
      console.log(mix);
      console.log(mix.pop()); //라스트인퍼스트아웃 LIFO 리포
      console.log(mix);
      console.log(mix.pop()); //라스트인퍼스트아웃 LIFO 리포
      console.log(mix);
      console.log(mix.push({ name: "공은성" }));
      console.log(mix);
      mix.push(["a", "b"]);
      console.log(mix);

      mix.push(4.5);
      console.log(mix);
      /* 매개변수(parameter) 함수를 실행하기 위해 전달하는 값*/
      //4. 배열의 특정 요소를 수정
      mix[2] = 100;
      console.log(mix);
      delete mix[2];
      console.log(mix);
      /*3. 활용
      - object 와 함께 사용
      - 예를 들어 우리가 개발한 웹사이트에서 
        사용자 목록을 가져와 처리를 한다고 가정하자
        */
      // let userList = [{}, {}, {}]; //선언만하고 할당 X
      let userList = [
        {
          name: "정국",
          gender: "남자",
          email: "jung@gamil.com",
          phone: "000-1111-1111",
        },
        {
          name: "뷔",
          gender: "남자",
          email: "vui@gamil.com",
          phone: "000-2222-1111",
        },
        {
          name: "로제",
          gender: "여자",
          email: "rose@gamil.com",
          phone: "000-3333-1111",
        },
      ];
      console.log(userList[2].phone);

      prompt("누구의 전화번호를 알고싶나요?");
      if (userList[0].name) {
        document.write(userList[0].phone);
      } else if (userList[1].name) {
        document.write(userList[1].phone);
      } else if (userList[2].name) {
        document.write(userList[2].phone);
      }
    </script>
  </body>
</html>
