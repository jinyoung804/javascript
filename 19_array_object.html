<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      table {
        border-collapse: collapse;
        width: 50%;
        background-color: lightyellow;
      }
      th,
      td {
        border: 1px solid black;
        padding: 5px;
        text-align: center;
      }
      thead {
        background-color: rgb(236, 215, 97);
      }
    </style>
  </head>
  <body>
    <button onclick="doSearch1()">조회1</button>
    <button onclick="doSearch2()">조회2</button>
    <table class="tableEx">
      <thead>
        <th>학번</th>
        <th>이름</th>
        <th>벌점</th>
      </thead>
      <tbody>
        <tr>
          <td>2317</td>
          <td>홍성재</td>
          <td>8</td>
        </tr>
      </tbody>
      <tbody>
        <tr>
          <td>2306</td>
          <td>박주혁</td>
          <td>2</td>
        </tr>
      </tbody>
      <tbody>
        <tr>
          <td>2305</td>
          <td>민서연</td>
          <td>1</td>
        </tr>
      </tbody>
      <tbody>
        <tr>
          <td>2312</td>
          <td>이담현</td>
          <td>2</td>
        </tr>
      </tbody>
    </table>
    <br />
    <table class="tableEx">
      <thead>
        <th>음료</th>
        <th>가격</th>
      </thead>
      <tbody id="tbody"></tbody>
    </table>
    <script>
      //자바스크립트에서 가장 많이 사용하며 실무에서 중요도가 높은 객체
      let brands = ["구글", "애플", "아마존", "삼성", "하이닉스", "메타"];

      //1. toString() : 배열요소를 하나의 문자열(,)로 합치기
      console.log(brands.toString()); //구글,애플,아마존,삼성,하이닉스,메타

      //2. ******join() : 파라미터로 전달된 문자를 이용해서 하나의  문자열로 합치기
      console.log(brands.join("")); //구글애플아마존삼성하이닉스메타
      console.log(brands.join("/")); //구글/애플/아마존/삼성/하이닉스/메타

      //2-1. join() 실무 활용 : db에서 데이터를 읽어와 동적으로 표를 만들어 화면에 출력
      // +=(문자열) : 장점 : 코드가 쉽다 단점 : 데이터 수가 많으면 performance낮아짐
      const doSearch1 = () => {
        //1. db에서 데이터 읽어오기
        const drinkList = [
          { name: "오렌지", price: 1000 },
          { name: "파워에이드", price: 1200 },
          { name: "커피", price: 700 },
          { name: "보리음료", price: 1200 },
          { name: "코카콜라", price: 1800 },
        ];
        //2. 데이터 갯수 만큼 랜더링해서 출력
        let trTags = "";
        for (drink of drinkList) {
          trTags += "<tr>";
          trTags += "<td>" + drink.name + "</td>";
          trTags += "<td>" + drink.price + "</td>";
          trTags += "</tr>";
        }
        console.log(trTags);
        document.getElementById("tbody").innerHTML = trTags;
      };

      //join() push()
      const doSearch2 = () => {
        //1. db에서 데이터 읽어오기
        const drinkList = [
          { name: "오렌지", price: 1000 },
          { name: "파워에이드", price: 1200 },
          { name: "커피", price: 700 },
          { name: "보리음료", price: 1200 },
          { name: "코카콜라", price: 1800 },
        ];
        //2. 데이터 갯수 만큼 랜더링해서 출력
        let trTags = [];
        for (drink of drinkList) {
          trTags = drinkList.push(drink.name);
          trTags = drinkList.push(drink.price);
          drink.join();
        }
        console.log(trTags);
        document.getElementById("tbody").innerHTML = trTags;
      };
    </script>
  </body>
</html>
