<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <script>
      let brands = ["애플", "구글", "아마존", "마이크로소프트", "메타"];
      //1. 배열
      for (const brand of brands) {
        //배열안에 있는 요소들을 대표할 수 있는 변수명 지정 brand
        console.log(brand);
      }
      //2. 문자열
      const lang = "JavaScript";
      for (const char of lang) {
        console.log(char);
      }
      //3. 숫자를 한글자씩
      let num = 90223434211; //Number Object
      for (const number of String(num)) {
        console.log(number);
      }

      /*let numString = num.toString();
      let numString = num. */
    </script>
  </body>
