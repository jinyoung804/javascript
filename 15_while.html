<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <script>
      /* while
        - 조건이 참인동안 반복
        - 무한 루프 조심
        - 한 번도 실행하지 않을 수도 있다.
        */
      let i = 0;
      while (i < 10) {
        console.log(i);
        i++;
      }
      console.log(i); //10
      //2. do while: 반드시 1번은 실행
      do {
        console.log("do while:", i);
        i++;
      } while (i < 10);

      //활용
      //동전 교환기 코드
      //7900원을 입력받아 500원짜리 몇 개, 거스름돈 원 출력 코드

      let inputMoney = 7900;
      let coinUnit = 500;
      let k = 0;

      while (coinUnit * k < inputMoney) {
        console.log(coinUnit * k);
        k++;
      }
      let total = coinUnit * k;
      console.log("500원:", k, "개");
      console.log("거스름돈:", inputMoney - total);
    </script>
  </body>
</html>
