<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>삭제 확인</title>
  </head>
  <body>
    <script>
      const pwd = "1234";

      function doDelete() {
        // prompt의 반환값을 userInput 변수에 저장
        const userInput = prompt("비밀번호 입력 : ");

        if (pwd === userInput) {
          if (confirm("정말 삭제할까요?")) {
            console.log("삭제");
          } else {
            console.log("취소하였습니다");
          }
        } else {
          window.alert("비밀번호 오류!!!");
        }
      }

      // 함수 실행
      //doDelete();

      const openNaver = () => {
        window.open("https://naver.com");
      };
      // openNaver();

      //setTimeout : 밀리초
      const myTimeout = setTimeout(function () {
        openNaver();
      }, 3000);

      //setInterval

      const myInterval = setInterval(() => {
        console.log("2초마다 나온다");
      }, 2000);

      clearInterval(myInterval);
      clearTimeout(myTimeout);
    </script>
  </body>
</html>
