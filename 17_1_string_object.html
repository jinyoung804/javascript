<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <script>
      //4. slice() 실무 활용 예제
      //4-1. 긴 문자열을 일부만 잘라서 보여주고 나머지는 "..." 처리시
      const longString =
        "올해 1분기 한국 경제가 주요 국가 가운데 가장 높은 성장률을 기록한 것으로 나타났다. 지난해 말까지만 해도 세계 주요국 가운데 하위권에 머물렀던 한국 경제가 불과 한 분기 만에 분위기를 완전히 뒤집은 것이다. ";
      const truncateTitle = (title, maxLength) => {
        if (title.length > maxLength) {
          return title.slice(0, maxLength) + "....";
        } else {
          return title;
        }
      };
      console.log(truncateTitle(longString, 15)); //longString은 title, 15는 maxLength

      //4-2. 마스킹
      let phoneNumber = "010-1234-5678";
      let hiddenNumber = "";
      hiddenNumber = phoneNumber.slice(0, -4) + "****";
      console.log(hiddenNumber); //010-1234-****
      phoneNumber = "010-345-6789";
      hiddenNumber = phoneNumber.slice(0, -4) + "****";
      console.log(hiddenNumber); //010-345-****

      //7.repalce() 실무 활용 예제(with 정규식(regular expression))
      //회원가입시 전번 010-1111-2222 형식으로 입력 => db에 저장시 01011112222
      /*정규식 : 특정한 포맷을 만들어 내는 식
      - /   /사이에 작성
      - D : 숫자 의미
      - \ : not
      - 옵션 : g => 모두(all)      i=> 대소문자를 구분하지 않는다.  */
      phoneNumber = "010-345-6789";
      let clearNumber = phoneNumber.replace(/\D/g, "");
      console.log(clearNumber); // 0103456789

       let str = "Welcome JeJu!! jeju!!";
      console.log(str.replace(/JeJu/gi, "Seoul"));
      
      //12. padStart() 실무 활용 예제
      //앞자리 마스킹, 카드 번호(16)를 db에서 읽어와 뒷자리 4자리만 보여주고자 할 경우
      const cardNumber = "7654";
      const maskCardNumber = cardNumber.padStart(16, "*");
      console.log(maskCardNumber);

     //주민등록 번호 뒷자리의 첫글자를 이용해 성별을 확인
      //091015-3058465, 1,3(내국인 남성) 2,4(내국인 여성) 5,7(외국인 남성) 6,8(외국인 여성)
      const checkGender = (sn) => {
        if (sn.charAt(7) == 1 || sn.charAt(7) == 3) {
          gender = "내국인남성";
        } else if (sn.charAt(7) == 2 || sn.charAt(7) == 4) {
          gender = "내국인여성";
        } else if (sn.charAt(7) == 5 || sn.charAt(7) == 7) {
          gender = "외국인남성";
        } else if (sn.charAt(7) == 6 || sn.charAt(7) == 8) {
          gender = "외국인여성";
        } else {
          gender = "알 수 없음";
        }
        return gender;
      };
      console.log(checkGender("091015-3058465")); //내국인 남성
      console.log(checkGender("091115-4058465"));
      //16. split() 실무 활용 예제
      //url 에서 특정 파라미터를 추출하기
      const url = "https://myshop.com/products/electronics/iphone15";
      const pageSegment = url.split("/");
      let size = pageSegment.length;
      console.log(pageSegment);
      console.log(`카테고리 : ${pageSegment[size - 2]}`);
      console.log(`제품명 : ${pageSegment[size - 1]}`);

      //*******************로그 파일 내용 가져오기 ************************
      //접근 허용이 안 되는 사용자의 로그 기록 찾기
      const csvData =
        "2026-04-29, Login_Success,uer_01\n2024-04-29, Login_Fail, user_02";
      const logData = csvData.split("\n");
      console.log(logData);

      for (line of logData) {
        [date, status, user] = line.split(","); //배열 구조 분해 할당

        if (status === "Login_Fail") {
          console.log(`${user}가 ${date}에 로그인에 실패했습니다`);
        }
      }

      //18. endsWith() 실무 활용 예제
    </script>
  </body>
</html>
