<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style></style>
  </head>
  <body>
    <h1>Posts 데이터 관리</h1>
    <div>
      <input type="text" id="inputId" placeholder="ID" />
      <input type="text" id="inputTitle" placeholder="Title" />
      <input type="text" id="inputViews" placeholder="Views" />
    </div>
    <div>
      <button id="btnRead" onclick="getData()">조회</button>
      <button id="btnCreate" onclick="postData()">추가</button>
      <button id="btnUpdate" onclick="putData()">수정</button>
      <button id="btnDelete" onclick="deleteData()">삭제</button>
    </div>
    <h2>데이터 목록</h2>
    <div id="postsLists"></div>
    <script>
      let url = "http://localhost:3000";

      // 조회
      const getData = () => {
        const xhr = new XMLHttpRequest();
        xhr.open("GET", url + "/posts");
        xhr.setRequestHeader("content-type", "application/json");
        xhr.send();

        xhr.onload = () => {
          if (xhr.status === 200) {
            const result = JSON.parse(xhr.response);
            render(result);
          } else {
            console.log("조회실패: ", xhr.status);
          }
        };
      };

      const render = (data) => {
        let html = "";
        data.forEach((post) => {
          html += `<p>ID: ${post.id} | Title: ${post.title} | Views: ${post.views}</p>`;
        });
        document.getElementById("postsLists").innerHTML = html;
      };

      // 추가
      const postData = () => {
        const id = document.getElementById("inputId");
        const title = document.getElementById("inputTitle");
        const views = document.getElementById("inputViews");

        //유효성
        if (title.value === "" || views.value === "") {
          alert("데이터를 모두 입력해주세요");
          return;
        }

        const xhr = new XMLHttpRequest();

        xhr.open("POST", url + "/posts");

        xhr.setRequestHeader("content-type", "application/json");

        const newData = {
          id: id.value,
          title: title.value,
          views: views.value,
        };
        xhr.send(JSON.stringify(newData));

        xhr.onload = () => {
          if (xhr.status === 200 || xhr.status === 201) {
            const result = JSON.parse(xhr.response);
            console.log("추가 성공:", result);
            id.value = "";
            title.value = "";
            views.value = "";
            getData(); // 목록 새로고침
          } else {
            console.log("실패 상태코드:", xhr.status, xhr.statusText);
          }
        };
      };

      //수정
      const putData = () => {
        const id = document.getElementById("inputId");
        const title = document.getElementById("inputTitle");
        const views = document.getElementById("inputViews");

        //유효성
        if (views.value === "") {
          alert("데이터를 모두 입력해주세요");
          return;
        }

        const xhr = new XMLHttpRequest();

        xhr.open("PUT", url + "/posts/" + id); //id

        xhr.setRequestHeader("content-type", "application/json");

        const putData = { title: title.value, views: views.value };

        xhr.send(JSON.stringify(putData));

        xhr.onload = () => {
          if (xhr.status === 200) {
            console.log("수정 성공:", JSON.parse(xhr.response));
            id.value = "";
            title.value = "";
            views.value = "";
            getData();
          } else {
            console.log("실패 상태코드:", xhr.status, xhr.statusText);
          }
        };
      };

      /*추가 : 추가와 동시에 input clear
      수정 : 덮어쓰기*/
    </script>
  </body>
</html>
