<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <script>
      //...의 활용
      //1. concate
      let arr1 = [1, 2, 3];
      let arr2 = [4, 5, 6];
      let arr3 = [7, 8, 9];
      let arr6 = [...arr1, ...arr2, ...arr3]; //무조건 점 3개
      console.log(arr6);

      //2. 복사(shallow copy)
      let target = ["a", "b", "c"];
      let result = [...target]; //target복사
      console.log(target);
      console.log(result);
      console.log(target === result); //false 주소까지 같지 않기 때문에 얕은 복사

      //3. 형변환
      const wishList = new Set();
      wishList.add("d");
      wishList.add("e");
      wishList.add("f");
      console.log(wishList);
      console.log([...wishList]);

      //4. rest parameter
      function sumRM(...nums) {
        let sum = 0;
        for (const n of nums) {
          sum += n;
        }
        return sum;
      }
    </script>
  </body>
</html>
